# SECURITY: see the header in checks.yml; the same checkout, permissions and pinning rules
# apply. This workflow is the one that publishes, so the pins matter most here: `publish-pypi`
# holds `id-token: write` (PyPI trusted publishing) and `github-release` holds
# `contents: write`, and neither job checks out or runs repository code.
#
# Two ways in:
#   - a `v*` tag push builds, publishes to PyPI and creates the GitHub release;
#   - a manual run (`workflow_dispatch`, input `tag`) builds nothing: it takes the wheel and
#     sdist already attached to that tag's GitHub release and publishes exactly those files to
#     PyPI. It is the recovery path for a release whose `publish-pypi` job failed after the
#     GitHub release was created (v0.3.0), without rebuilding assets whose hashes are pinned
#     downstream. PyPI's trusted publisher matches on this file name and the `pypi`
#     environment, so the manual run must stay in this workflow.
name: Release
on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing release tag whose wheel and sdist to publish to PyPI (e.g. v0.3.0)'
                required: true
                type: string

jobs:
    build:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  python-version: '3.12'
            - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
              with:
                  r-version: 'release'
                  use-public-rspm: true
            - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
              with:
                  working-directory: r
            - name: Versions must match the tag
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  py="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' python/src/safeinsights_fusion/__init__.py)"
                  r="$(sed -n 's/^Version: //p' r/DESCRIPTION)"
                  echo "tag=$tag python=$py r=$r"
                  [ "$tag" = "$py" ] && [ "$tag" = "$r" ]
            - name: Build Python sdist and wheel
              run: uv build --project python --out-dir dist
            - name: Build R source package
              run: R CMD build r && mv safeinsights.fusion_*.tar.gz dist/
            - name: SBOM (CycloneDX)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  format: 'cyclonedx'
                  output: 'dist/fusion-sdk-sbom.cdx.json'
                  version: v0.70.0
                  cache-dir: ${{ github.workspace }}/.cache/trivy
            - name: License gate
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: 'fs'
                  scan-ref: '.'
                  scanners: 'license'
                  severity: 'HIGH,CRITICAL'
                  exit-code: '1'
                  trivyignores: '.trivyignore.yaml'
                  version: v0.70.0
                  cache-dir: ${{ github.workspace }}/.cache/trivy
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/

    # Manual runs only: stage the Python artifacts of an existing GitHub release as `dist`, the
    # same artifact name `build` uploads, so `publish-pypi` is identical on both paths.
    fetch-release:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Download the release's wheel and sdist
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag }}
              run: |
                  printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag must look like v1.2.3"; exit 1; }
                  version="${TAG#v}"
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
                      --pattern "safeinsights_fusion-${version}-py3-none-any.whl" \
                      --pattern "safeinsights_fusion-${version}.tar.gz"
                  ls -l dist
                  [ "$(find dist -type f | wc -l)" -eq 2 ] || { echo "::error::expected one wheel and one sdist on release $TAG"; exit 1; }
                  sha256sum dist/*
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/

    publish-pypi:
        needs: [build, fetch-release]
        # Exactly one of the two is skipped on every run, which would skip this job by default.
        if: ${{ !cancelled() && (needs.build.result == 'success' || needs.fetch-release.result == 'success') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: pypi
        permissions:
            id-token: write # trusted publishing
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist
            - name: Keep only the Python artifacts
              run: mkdir py && mv dist/*.whl dist/*.tar.gz py/ && rm -f py/safeinsights.fusion_*.tar.gz
            - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
              with:
                  packages-dir: py/

    github-release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: dist
            - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
              with:
                  files: dist/*
                  generate_release_notes: true
