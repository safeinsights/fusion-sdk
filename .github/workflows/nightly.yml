name: Nightly chaos
on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:
        inputs:
            seeds:
                description: number of random scenarios
                default: '6'
            seed:
                description: replay one seed (optional)
                default: ''

permissions:
    contents: read

jobs:
    chaos:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            - uses: r-lib/actions/setup-r@v2
              with:
                  r-version: 'release'
                  use-public-rspm: true
            - uses: r-lib/actions/setup-r-dependencies@v2
              with:
                  working-directory: r
            - name: Install both packages
              run: |
                  pip install ./python
                  R CMD INSTALL --no-docs r
            - name: Chaos
              run: |
                  if [ -n "${{ github.event.inputs.seed }}" ]; then
                      python3 tools/chaos.py --py-installed --seed "${{ github.event.inputs.seed }}"
                  else
                      python3 tools/chaos.py --py-installed --seeds "${{ github.event.inputs.seeds || '6' }}"
                  fi
