# Trivy suppressions. trivy.yaml points the vulnerability scan here (`ignorefile`) and the
# license step passes it as `trivyignores` (see .github/workflows/checks.yml). Every entry
# carries a statement and, for vulnerabilities, an expiry: Trivy treats `expired_at` as
# 00:00 UTC on that date and fails the scan again from then on, which is the intended review
# trigger. Date an entry the day *after* the last day it should cover.
vulnerabilities: []

# License suppressions for Trivy's license scanner (see .github/workflows/checks.yml).
#
# The SDK has no runtime dependencies in Python and only `curl` + `jsonlite` in R
# (both MIT), so nothing is suppressed today. A new entry here is a review trigger:
# it means a dependency with a HIGH/CRITICAL-classified license entered the tree,
# which ADR 0003 (pure-language, ubiquitous dependencies only) forbids without a
# new decision record.
licenses: []
