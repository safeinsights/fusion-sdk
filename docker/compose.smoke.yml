# Docker smoke profile (checks.yml `docker-smoke`): a fake tunnel pair plus one smoke
# container per language, each built from the stock base image the Data Partner
# images are expected to derive from. Run from the repo root:
#
#   docker compose -f docker/compose.smoke.yml up --build --abort-on-container-exit --exit-code-from smoke-python smoke-python fake
#   docker compose -f docker/compose.smoke.yml up --build --abort-on-container-exit --exit-code-from smoke-r smoke-r fake
services:
    fake:
        build:
            context: ..
            dockerfile: docker/fake.Dockerfile
        read_only: true

    smoke-python:
        build:
            context: ..
            dockerfile: docker/python.Dockerfile
        depends_on: [fake]
        read_only: true
        tmpfs: [/tmp]
        environment:
            FUSION_ROLE: destination
            FUSION_TUNNEL_ENDPOINT: http://fake:8471
            FUSION_TUNNEL_TOKEN: fake-leg-a-destination
            FUSION_READY_TIMEOUT_S: '60'

    smoke-r:
        build:
            context: ..
            dockerfile: docker/r.Dockerfile
        depends_on: [fake]
        read_only: true
        tmpfs: [/tmp]
        environment:
            FUSION_ROLE: source
            FUSION_TUNNEL_ENDPOINT: http://fake:8472
            FUSION_TUNNEL_TOKEN: fake-leg-a-source
            FUSION_READY_TIMEOUT_S: '60'
